<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五十音あつめ</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family:
    "Hiragino Maru Gothic ProN",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
  background: #e9eff2;
  color: #3f5059;
  letter-spacing: 0.03em;
}
/* ===== ヘッダー ===== */
header {
  background: #718b99;
  color: white;
  text-align: center;
  padding: 24px 16px 22px;
  box-shadow: 0 3px 10px rgba(70, 90, 100, 0.15);
}
header h1 {
  margin: 0;
  font-size: 27px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
header p {
  margin: 8px 0 0;
  font-size: 13px;
  opacity: 0.9;
}
/* ===== 全体 ===== */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px 14px 40px;
}
/* ===== 進捗 ===== */
.progress-box {
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid #d0dce1;
  border-radius: 18px;
  padding: 14px 18px;
  margin-bottom: 18px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(70, 90, 100, 0.08);
}
.progress-text {
  font-size: 15px;
  font-weight: 600;
  color: #536b76;
}
.progress-number {
  color: #6d8998;
  font-size: 22px;
  font-weight: 700;
}
/* ===== 五十音グリッド ===== */
.kana-grid {
  display: grid;
  gap: 10px;
}
.kana-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}
.kana-row.three {
  grid-template-columns: repeat(5, 1fr);
}
/* ===== カード ===== */
.kana-card {
  position: relative;
  aspect-ratio: 1 / 1;
  background: #ffffff;
  border: 1px solid #cbd9df;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 3px 9px rgba(70, 90, 100, 0.09);
  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease;
}
.kana-card:active {
  transform: scale(0.97);
}
.kana-card:hover {
  box-shadow: 0 5px 14px rgba(70, 90, 100, 0.14);
}
/* 空カード */
.kana-empty {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #8ca0aa;
}
.kana-empty .kana {
  font-size: 31px;
  font-weight: 600;
}
.plus {
  font-size: 25px;
  line-height: 1;
  margin-top: 4px;
  color: #9eb0b9;
}
/* 写真 */
.kana-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
/* 文字ラベル */
.kana-label {
  position: absolute;
  left: 7px;
  bottom: 7px;
  min-width: 30px;
  height: 30px;
  padding: 0 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.9);
  color: #526a75;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  box-shadow: 0 2px 5px rgba(50, 70, 80, 0.15);
}
/* 削除ボタン */
.delete-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 27px;
  height: 27px;
  border: none;
  border-radius: 50%;
  background: rgba(75, 91, 99, 0.75);
  color: white;
  font-size: 17px;
  line-height: 27px;
  padding: 0;
  cursor: pointer;
  z-index: 5;
}
/* ===== ボタン ===== */
.button-area {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 22px;
}
button {
  font-family: inherit;
}
.main-button {
  width: 100%;
  border: none;
  border-radius: 15px;
  padding: 14px 16px;
  background: #718b99;
  color: white;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.05em;
  box-shadow: 0 4px 9px rgba(70, 90, 100, 0.15);
  cursor: pointer;
}
.main-button:active {
  transform: scale(0.98);
}
.sub-button {
  width: 100%;
  border: 1px solid #b9cbd2;
  border-radius: 15px;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.75);
  color: #607985;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
/* ===== ファイル入力 ===== */
#fileInput {
  display: none;
}
/* ===== モーダル ===== */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(49, 65, 72, 0.65);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}
.modal.show {
  display: flex;
}
.modal-content {
  width: min(92vw, 500px);
  max-height: 92vh;
  overflow-y: auto;
  background: #f8fafb;
  border-radius: 22px;
  padding: 18px;
  box-shadow: 0 10px 35px rgba(40, 55, 65, 0.25);
}
.modal-title {
  text-align: center;
  color: #526b76;
  font-size: 18px;
  font-weight: 700;
  margin: 2px 0 14px;
}
/* ===== クロップ ===== */
.crop-area {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #dce5e9;
  border-radius: 15px;
  overflow: hidden;
  touch-action: none;
  box-shadow:
    inset 0 0 0 1px #c5d3d9,
    0 3px 10px rgba(70, 90, 100, 0.08);
}
#cropImage {
  position: absolute;
  max-width: none;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  display: none;
}
/* ===== ズーム ===== */
.zoom-area {
  margin: 16px 0 12px;
}
.zoom-label {
  text-align: center;
  font-size: 13px;
  color: #71868f;
  margin-bottom: 7px;
}
#zoomSlider {
  width: 100%;
  accent-color: #718b99;
}
/* ===== モーダルボタン ===== */
.modal-buttons {
  display: grid;
  gap: 9px;
}
.modal-buttons button {
  border: none;
  border-radius: 14px;
  padding: 13px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.cancel-button {
  background: #e2e9ec;
  color: #667b84;
}
.save-photo-button {
  background: #9aafb9;
  color: white;
}
.use-button {
  background: #718b99;
  color: white;
}
/* ===== PC表示 ===== */
@media (min-width: 700px) {
  .kana-grid {
    gap: 12px;
  }
  .kana-row {
    gap: 12px;
  }
  .container {
    padding-left: 20px;
    padding-right: 20px;
  }
}
</style>
</head>
<body>
<header>
  <h1>五十音あつめ</h1>
  <p>写真を集めて、五十音を完成させよう ♡</p>
</header>
<div class="container">
  <div class="progress-box">
    <div class="progress-text">
      <span id="progressNumber" class="progress-number">0</span>
      / 46 文字 集めました
    </div>
  </div>
  <div id="kanaGrid" class="kana-grid"></div>
  <div class="button-area">
    <button class="main-button" onclick="saveBoard()">
      一覧を画像保存
    </button>
    <button class="sub-button" onclick="clearAll()">
      すべて削除
    </button>
  </div>
</div>
<input
  type="file"
  id="fileInput"
  accept="image/*"
>
<!-- モーダル -->
<div id="cropModal" class="modal">
  <div class="modal-content">
    <div class="modal-title">
      写真を調整
    </div>
    <div id="cropArea" class="crop-area">
      <img id="cropImage" alt="">
    </div>
    <div class="zoom-area">
      <div class="zoom-label">
        拡大・縮小
      </div>
      <input
        type="range"
        id="zoomSlider"
        min="1"
        max="3"
        step="0.01"
        value="1"
      >
    </div>
    <div class="modal-buttons">
      <button
        class="cancel-button"
        onclick="closeModal()"
      >
        キャンセル
      </button>
      <button
        class="save-photo-button"
        onclick="saveCurrentPhotoToPhotos()"
      >
        写真アプリに保存
      </button>
      <button
        class="use-button"
        onclick="usePhoto()"
      >
        この写真を使う
      </button>
    </div>
  </div>
</div>
<script>
const kanaRows = [
  ["あ","い","う","え","お"],
  ["か","き","く","け","こ"],
  ["さ","し","す","せ","そ"],
  ["た","ち","つ","て","と"],
  ["な","に","ぬ","ね","の"],
  ["は","ひ","ふ","へ","ほ"],
  ["ま","み","む","め","も"],
  ["や","","ゆ","","よ"],
  ["ら","り","る","れ","ろ"],
  ["わ","を","ん","",""]
];
const allKana = [
  "あ","い","う","え","お",
  "か","き","く","け","こ",
  "さ","し","す","せ","そ",
  "た","ち","つ","て","と",
  "な","に","ぬ","ね","の",
  "は","ひ","ふ","へ","ほ",
  "ま","み","む","め","も",
  "や","ゆ","よ",
  "ら","り","る","れ","ろ",
  "わ","を","ん"
];
let photos =
  JSON.parse(localStorage.getItem("gojuonPhotos") || "{}");
let currentKana = null;
let originalImage = null;
let imageX = 0;
let imageY = 0;
let baseScale = 1;
let baseImageWidth = 0;
let baseImageHeight = 0;
let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
const fileInput = document.getElementById("fileInput");
const cropModal = document.getElementById("cropModal");
const cropArea = document.getElementById("cropArea");
const cropImage = document.getElementById("cropImage");
const zoomSlider = document.getElementById("zoomSlider");
// ================================
// 写真選択
// ================================
fileInput.addEventListener("change", function () {
  const file = this.files[0];
  if (!file || !currentKana) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    const dataURL = e.target.result;
    originalImage = new Image();
    originalImage.onload = function () {
      cropImage.src = dataURL;
      cropImage.style.display = "block";
      cropImage.style.visibility = "visible";
      cropImage.style.opacity = "1";
      zoomSlider.value = 1;
      zoomSlider.dataset.oldZoom = 1;
      cropModal.classList.add("show");
      requestAnimationFrame(() => {
        setupCrop();
      });
    };
    originalImage.src = dataURL;
  };
  reader.readAsDataURL(file);
  fileInput.value = "";
});
// ================================
// クロップ初期設定
// ================================
function setupCrop() {
  if (!originalImage) return;
  const areaWidth = cropArea.clientWidth;
  const areaHeight = cropArea.clientHeight;
  const imageWidth = originalImage.naturalWidth;
  const imageHeight = originalImage.naturalHeight;
  baseScale = Math.max(
    areaWidth / imageWidth,
    areaHeight / imageHeight
  );
  baseImageWidth = imageWidth * baseScale;
  baseImageHeight = imageHeight * baseScale;
  imageX = (areaWidth - baseImageWidth) / 2;
  imageY = (areaHeight - baseImageHeight) / 2;
  zoomSlider.value = 1;
  zoomSlider.dataset.oldZoom = 1;
  updateCropImage();
}
// ================================
// 画像位置更新
// ================================
function updateCropImage() {
  const zoom = Number(zoomSlider.value);
  const width = baseImageWidth * zoom;
  const height = baseImageHeight * zoom;
  cropImage.style.width = width + "px";
  cropImage.style.height = height + "px";
  cropImage.style.left = imageX + "px";
  cropImage.style.top = imageY + "px";
  keepImageInside();
}
// ================================
// 画像が枠から出ないようにする
// ================================
function keepImageInside() {
  const areaWidth = cropArea.clientWidth;
  const areaHeight = cropArea.clientHeight;
  const zoom = Number(zoomSlider.value);
  const width = baseImageWidth * zoom;
  const height = baseImageHeight * zoom;
  if (width >= areaWidth) {
    imageX = Math.min(
      0,
      Math.max(areaWidth - width, imageX)
    );
  } else {
    imageX = (areaWidth - width) / 2;
  }
  if (height >= areaHeight) {
    imageY = Math.min(
      0,
      Math.max(areaHeight - height, imageY)
    );
  } else {
    imageY = (areaHeight - height) / 2;
  }
  cropImage.style.left = imageX + "px";
  cropImage.style.top = imageY + "px";
}
// ================================
// ズーム
// ================================
zoomSlider.addEventListener("input", function () {
  const oldZoom =
    Number(zoomSlider.dataset.oldZoom || 1);
  const newZoom =
    Number(zoomSlider.value);
  const areaWidth = cropArea.clientWidth;
  const areaHeight = cropArea.clientHeight;
  const centerX = areaWidth / 2;
  const centerY = areaHeight / 2;
  const oldWidth = baseImageWidth * oldZoom;
  const oldHeight = baseImageHeight * oldZoom;
  const imagePointX =
    (centerX - imageX) / oldWidth;
  const imagePointY =
    (centerY - imageY) / oldHeight;
  const newWidth = baseImageWidth * newZoom;
  const newHeight = baseImageHeight * newZoom;
  imageX =
    centerX - imagePointX * newWidth;
  imageY =
    centerY - imagePointY * newHeight;
  zoomSlider.dataset.oldZoom = newZoom;
  updateCropImage();
});
// ================================
// ドラッグ
// ================================
cropArea.addEventListener("pointerdown", function (e) {
  dragging = true;
  cropArea.setPointerCapture(e.pointerId);
  dragStartX = e.clientX - imageX;
  dragStartY = e.clientY - imageY;
});
cropArea.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  imageX = e.clientX - dragStartX;
  imageY = e.clientY - dragStartY;
  updateCropImage();
});
cropArea.addEventListener("pointerup", function () {
  dragging = false;
});
cropArea.addEventListener("pointercancel", function () {
  dragging = false;
});
// ================================
// クロップ画像作成
// ================================
function createCroppedCanvas() {
  const canvas = document.createElement("canvas");
  canvas.width = 800;
  canvas.height = 800;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, 800, 800);
  const areaWidth = cropArea.clientWidth;
  const ratio = 800 / areaWidth;
  const zoom = Number(zoomSlider.value);
  const drawWidth =
    baseImageWidth * zoom * ratio;
  const drawHeight =
    baseImageHeight * zoom * ratio;
  const drawX =
    imageX * ratio;
  const drawY =
    imageY * ratio;
  ctx.drawImage(
    originalImage,
    drawX,
    drawY,
    drawWidth,
    drawHeight
  );
  return canvas;
}
// ================================
// この写真を使う
// ================================
function usePhoto() {
  if (!currentKana || !originalImage) return;
  const canvas = createCroppedCanvas();
  photos[currentKana] =
    canvas.toDataURL("image/jpeg", 0.88);
  savePhotos();
  closeModal();
  renderTable();
}
// ================================
// 写真アプリに保存
// ================================
async function saveCurrentPhotoToPhotos() {
  if (!originalImage) return;
  const canvas = createCroppedCanvas();
  canvas.toBlob(async function (blob) {
    if (!blob) return;
    const file = new File(
      [blob],
      "五十音あつめ.png",
      {
        type: "image/png"
      }
    );
    try {
      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({ files: [file] })
      ) {
        await navigator.share({
          files: [file],
          title: "五十音あつめ"
        });
      } else {
        const url =
          URL.createObjectURL(blob);
        window.open(url, "_blank");
        alert(
          "画像を長押しして「写真に保存」を選んでください。"
        );
      }
    } catch (error) {
      console.log(error);
    }
  }, "image/png");
}
// ================================
// モーダルを閉じる
// ================================
function closeModal() {
  cropModal.classList.remove("show");
  currentKana = null;
  originalImage = null;
  cropImage.src = "";
  cropImage.style.display = "none";
}
// ================================
// localStorage保存
// ================================
function savePhotos() {
  try {
    localStorage.setItem(
      "gojuonPhotos",
      JSON.stringify(photos)
    );
  } catch (error) {
    alert(
      "写真の保存容量がいっぱいになりました。\n一部の写真を削除してください。"
    );
  }
}
// ================================
// 五十音表表示
// ================================
function renderTable() {
  const grid =
    document.getElementById("kanaGrid");
  grid.innerHTML = "";
  kanaRows.forEach(row => {
    const rowElement =
      document.createElement("div");
    rowElement.className = "kana-row";
    row.forEach(kana => {
      const card =
        document.createElement("div");
      card.className = "kana-card";
      if (!kana) {
        card.style.visibility = "hidden";
        rowElement.appendChild(card);
        return;
      }
      if (photos[kana]) {
        const img =
          document.createElement("img");
        img.src = photos[kana];
        card.appendChild(img);
        const label =
          document.createElement("div");
        label.className = "kana-label";
        label.textContent = kana;
        card.appendChild(label);
        const deleteBtn =
          document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "×";
        deleteBtn.onclick = function (e) {
          e.stopPropagation();
          if (
            confirm(
              `「${kana}」の写真を削除しますか？`
            )
          ) {
            delete photos[kana];
            savePhotos();
            renderTable();
          }
        };
        card.appendChild(deleteBtn);
      } else {
        const empty =
          document.createElement("div");
        empty.className = "kana-empty";
        const kanaText =
          document.createElement("div");
        kanaText.className = "kana";
        kanaText.textContent = kana;
        const plus =
          document.createElement("div");
        plus.className = "plus";
        plus.textContent = "+";
        empty.appendChild(kanaText);
        empty.appendChild(plus);
        card.appendChild(empty);
      }
      card.onclick = function () {
        currentKana = kana;
        fileInput.click();
      };
      rowElement.appendChild(card);
    });
    grid.appendChild(rowElement);
  });
  updateProgress();
}
// ================================
// 進捗
// ================================
function updateProgress() {
  const count =
    allKana.filter(kana => photos[kana]).length;
  document.getElementById(
    "progressNumber"
  ).textContent = count;
}
// ================================
// 一覧を画像保存
// ================================
async function saveBoard() {
  const canvas =
    document.createElement("canvas");
  const canvasWidth = 1200;
  const cardWidth = 210;
  const cardHeight = 210;
  const gap = 20;
  const rows = kanaRows.length;
  canvas.width = canvasWidth;
  canvas.height =
    150 +
    rows * (cardHeight + gap) +
    60;
  const ctx =
    canvas.getContext("2d");
  ctx.fillStyle = "#e9eff2";
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
  ctx.fillStyle = "#526a75";
  ctx.textAlign = "center";
  ctx.font =
    "bold 42px 'Hiragino Maru Gothic ProN', sans-serif";
  ctx.fillText(
    "五十音あつめ",
    canvas.width / 2,
    70
  );
  const startX = 55;
  const startY = 120;
  for (
    let r = 0;
    r < kanaRows.length;
    r++
  ) {
    for (
      let c = 0;
      c < 5;
      c++
    ) {
      const kana =
        kanaRows[r][c];
      if (!kana) continue;
      const x =
        startX +
        c * (cardWidth + gap);
      const y =
        startY +
        r * (cardHeight + gap);
      if (photos[kana]) {
        const img =
          new Image();
        img.src = photos[kana];
        await new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });
        ctx.drawImage(
          img,
          x,
          y,
          cardWidth,
          cardHeight
        );
      } else {
        drawEmptyKana(
          ctx,
          kana,
          x,
          y,
          cardWidth,
          cardHeight
        );
      }
      drawKanaLabel(
        ctx,
        kana,
        x,
        y,
        cardWidth,
        cardHeight
      );
    }
  }
  canvas.toBlob(async function (blob) {
    if (!blob) return;
    const file = new File(
      [blob],
      "五十音あつめ.png",
      {
        type: "image/png"
      }
    );
    try {
      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({ files: [file] })
      ) {
        await navigator.share({
          files: [file],
          title: "五十音あつめ"
        });
      } else {
        const url =
          URL.createObjectURL(blob);
        window.open(url, "_blank");
        alert(
          "画像を長押しして「写真に保存」を選んでください。"
        );
      }
    } catch (error) {
      console.log(error);
    }
  }, "image/png");
}
// ================================
// 空のマス
// ================================
function drawEmptyKana(
  ctx,
  kana,
  x,
  y,
  width,
  height
) {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(
    x,
    y,
    width,
    height
  );
  ctx.fillStyle = "#8ca0aa";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font =
    "bold 60px 'Hiragino Maru Gothic ProN', sans-serif";
  ctx.fillText(
    kana,
    x + width / 2,
    y + height / 2 - 15
  );
  ctx.font =
    "42px sans-serif";
  ctx.fillText(
    "+",
    x + width / 2,
    y + height / 2 + 55
  );
}
// ================================
// 文字ラベル
// ================================
function drawKanaLabel(
  ctx,
  kana,
  x,
  y,
  width,
  height
) {
  ctx.fillStyle =
    "rgba(255,255,255,0.9)";
  ctx.fillRect(
    x + 10,
    y + height - 48,
    40,
    38
  );
  ctx.fillStyle = "#526a75";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font =
    "bold 22px 'Hiragino Maru Gothic ProN', sans-serif";
  ctx.fillText(
    kana,
    x + 30,
    y + height - 29
  );
}
// ================================
// すべて削除
// ================================
function clearAll() {
  if (
    !confirm(
      "集めた写真をすべて削除しますか？"
    )
  ) {
    return;
  }
  photos = {};
  savePhotos();
  renderTable();
}
// ================================
// 初期表示
// ================================
renderTable();
</script>
