<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五十音あつめ</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family:
    "Hiragino Maru Gothic ProN",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
  background: #f7f9fa;
  color: #4d6672;
  letter-spacing: 0.02em;
}
/* =========================================
   ヘッダー
========================================= */
header {
  background: #587b8c;
  color: #ffffff;
  text-align: center;
  padding: 24px 16px 21px;
}
header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.08em;
}
header p {
  margin: 7px 0 0;
  font-size: 11px;
  opacity: 0.9;
  letter-spacing: 0.08em;
}
/* =========================================
   メイン
========================================= */
main {
  max-width: 700px;
  margin: 0 auto;
  padding: 22px 14px 35px;
}
/* =========================================
   進捗
========================================= */
.progress-box {
  background: #ffffff;
  border: 1px solid #d9e4e8;
  border-radius: 10px;
  padding: 13px 15px;
  margin-bottom: 16px;
  text-align: center;
}
.progress-number {
  font-size: 20px;
  font-weight: 600;
  color: #4f7487;
}
.progress-text {
  margin-top: 2px;
  font-size: 13px;
  color: #718892;
}
/* =========================================
   五十音グリッド
========================================= */
.kana-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 8px;
}
.kana-row.special {
  grid-template-columns: repeat(5, 1fr);
}
.kana-item {
  position: relative;
  aspect-ratio: 1 / 1;
  background: #ffffff;
  border: 1px solid #d7e3e7;
  border-radius: 9px;
  overflow: hidden;
  cursor: pointer;
}
.kana-item.empty {
  display: flex;
  align-items: center;
  justify-content: center;
}
.kana-item.empty:hover {
  background: #f1f7f9;
}
.kana-empty {
  font-size: 25px;
  color: #7895a2;
  font-weight: 500;
}
.kana-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
/*
  写真が入った場合、
  文字・ラベル・＋は表示しない
*/
.kana-item.has-photo .kana-label,
.kana-item.has-photo .kana-empty {
  display: none;
}
/* =========================================
   ラベル
========================================= */
.kana-label {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 7px 4px;
  background: rgba(255,255,255,0.9);
  color: #587b8c;
  text-align: center;
  font-size: 13px;
  font-weight: 500;
}
/* =========================================
   削除ボタン
========================================= */
.delete-btn {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 24px;
  height: 24px;
  border: none;
  border-radius: 50%;
  background: rgba(70, 96, 108, 0.85);
  color: #ffffff;
  font-size: 15px;
  line-height: 24px;
  padding: 0;
  cursor: pointer;
  z-index: 5;
}
/* =========================================
   ボタン
========================================= */
.button-area {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.main-button {
  width: 100%;
  border: none;
  border-radius: 9px;
  background: #587b8c;
  color: #ffffff;
  padding: 13px 15px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.main-button:hover {
  background: #4d7081;
}
.sub-button {
  width: 100%;
  border: 1px solid #cbdbe0;
  border-radius: 9px;
  background: #ffffff;
  color: #607d89;
  padding: 11px 15px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}
.sub-button:hover {
  background: #f2f7f8;
}
/* =========================================
   モーダル
========================================= */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(43, 62, 70, 0.58);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 18px;
}
.modal.show {
  display: flex;
}
.modal-content {
  width: 100%;
  max-width: 420px;
  background: #ffffff;
  border-radius: 12px;
  padding: 18px;
  box-shadow: 0 10px 35px rgba(40, 65, 75, 0.2);
}
.modal-title {
  margin: 0 0 13px;
  text-align: center;
  font-size: 16px;
  font-weight: 600;
  color: #587b8c;
}
/* =========================================
   クロップ
========================================= */
.crop-area {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  background: #edf2f4;
  border-radius: 7px;
  touch-action: none;
}
#cropImage {
  position: absolute;
  max-width: none;
  max-height: none;
  user-select: none;
  -webkit-user-drag: none;
  cursor: grab;
}
#cropImage:active {
  cursor: grabbing;
}
/* =========================================
   ズーム
========================================= */
.zoom-area {
  margin: 14px 0 4px;
}
.zoom-area label {
  display: block;
  margin-bottom: 6px;
  font-size: 12px;
  color: #708791;
}
#zoomSlider {
  width: 100%;
  accent-color: #587b8c;
}
/* =========================================
   モーダルボタン
========================================= */
.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}
.modal-buttons button {
  flex: 1;
  border-radius: 8px;
  padding: 11px 7px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}
.cancel-button {
  border: 1px solid #d2dfe3;
  background: #ffffff;
  color: #708791;
}
.save-photo-button {
  border: 1px solid #b9cfd7;
  background: #edf5f7;
  color: #557887;
}
.use-button {
  border: none;
  background: #587b8c;
  color: #ffffff;
}
/* =========================================
   スマホ
========================================= */
@media (max-width: 430px) {
  header {
    padding: 21px 14px 19px;
  }
  header h1 {
    font-size: 22px;
  }
  main {
    padding: 18px 10px 30px;
  }
  .kana-row {
    gap: 6px;
    margin-bottom: 6px;
  }
  .kana-empty {
    font-size: 23px;
  }
  .kana-label {
    font-size: 12px;
    padding: 6px 2px;
  }
  .delete-btn {
    width: 22px;
    height: 22px;
    line-height: 22px;
    font-size: 14px;
  }
}
</style>
</head>
<body>
<header>
  <h1>五十音あつめ</h1>
  <p>写真でつくる、わたしの五十音</p>
</header>
<main>
  <div class="progress-box">
    <div class="progress-number" id="progressNumber">0 / 46</div>
    <div class="progress-text">文字 集めました</div>
  </div>
  <div id="kanaGrid"></div>
  <div class="button-area">
    <button class="main-button" id="saveBoardButton">
      一覧を画像保存
    </button>
<button class="sub-button" id="clearAllButton">
  すべて削除
</button>
  </div>
</main>
<!-- =========================================
     ファイル選択
========================================= -->

<input
type=“file”
id=“fileInput”
accept=“image/*”
style=“display:none;”

<!-- =========================================
     クロップモーダル
========================================= -->
<div class="modal" id="cropModal">
  <div class="modal-content">
<h2 class="modal-title">写真を調整</h2>
<div class="crop-area" id="cropArea">
  <img id="cropImage" alt="">
</div>
<div class="zoom-area">
  <label for="zoomSlider">ズーム</label>
  <input
    type="range"
    id="zoomSlider"
    min="1"
    max="3"
    step="0.01"
    value="1"
  >
</div>
<div class="modal-buttons">
  <button
    class="cancel-button"
    id="cancelCropButton"
  >
    キャンセル
  </button>
  <button
    class="save-photo-button"
    id="savePhotoButton"
  >
    写真アプリに保存
  </button>
  <button
    class="use-button"
    id="usePhotoButton"
  >
    この写真を使う
  </button>
</div>
  </div>
</div>
<script>
/* =========================================
   五十音
========================================= */
const kanaRows = [
  ["あ","い","う","え","お"],
  ["か","き","く","け","こ"],
  ["さ","し","す","せ","そ"],
  ["た","ち","つ","て","と"],
  ["な","に","ぬ","ね","の"],
  ["は","ひ","ふ","へ","ほ"],
  ["ま","み","む","め","も"],
  ["や","","ゆ","","よ"],
  ["ら","り","る","れ","ろ"],
  ["わ","","を","","ん"]
];
const allKana = kanaRows.flat().filter(Boolean);
/* =========================================
   保存データ
========================================= */
let photos =
  JSON.parse(
    localStorage.getItem("gojuonPhotos") || "{}"
  );
/* =========================================
   DOM
========================================= */
const kanaGrid =
  document.getElementById("kanaGrid");
const progressNumber =
  document.getElementById("progressNumber");
const fileInput =
  document.getElementById("fileInput");
const cropModal =
  document.getElementById("cropModal");
const cropArea =
  document.getElementById("cropArea");
const cropImage =
  document.getElementById("cropImage");
const zoomSlider =
  document.getElementById("zoomSlider");
const usePhotoButton =
  document.getElementById("usePhotoButton");
const cancelCropButton =
  document.getElementById("cancelCropButton");
const savePhotoButton =
  document.getElementById("savePhotoButton");
const saveBoardButton =
  document.getElementById("saveBoardButton");
const clearAllButton =
  document.getElementById("clearAllButton");
/* =========================================
   クロップ用変数
========================================= */
let selectedKana = null;
let originalImage = null;
let imageScale = 1;
let imageX = 0;
let imageY = 0;
let startX = 0;
let startY = 0;
let dragging = false;
/* =========================================
   写真選択
========================================= */
function selectKana(kana) {
  selectedKana = kana;
  fileInput.value = "";
  fileInput.click();
}
fileInput.addEventListener("change", function () {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (event) {
    originalImage = new Image();
    originalImage.onload = function () {
      cropImage.src = event.target.result;
      cropModal.classList.add("show");
      requestAnimationFrame(() => {
        setupCrop();
      });
    };
    originalImage.src = event.target.result;
  };
  reader.readAsDataURL(file);
});
/* =========================================
   クロップ初期設定
========================================= */
function setupCrop() {
  const areaWidth = cropArea.clientWidth;
  const areaHeight = cropArea.clientHeight;
  const imageWidth = originalImage.naturalWidth;
  const imageHeight = originalImage.naturalHeight;
  const baseScale =
    Math.max(
      areaWidth / imageWidth,
      areaHeight / imageHeight
    );
  imageScale = baseScale;
  zoomSlider.value = 1;
  imageX =
    (areaWidth - imageWidth * imageScale) / 2;
  imageY =
    (areaHeight - imageHeight * imageScale) / 2;
  updateCropImage();
}
/* =========================================
   クロップ画像更新
========================================= */
function updateCropImage() {
  const width =
    originalImage.naturalWidth * imageScale;
  const height =
    originalImage.naturalHeight * imageScale;
  cropImage.style.width = width + "px";
  cropImage.style.height = height + "px";
  cropImage.style.left = imageX + "px";
  cropImage.style.top = imageY + "px";
}
/* =========================================
   画像を枠内に維持
========================================= */
function keepImageInside() {
  const areaWidth = cropArea.clientWidth;
  const areaHeight = cropArea.clientHeight;
  const width =
    originalImage.naturalWidth * imageScale;
  const height =
    originalImage.naturalHeight * imageScale;
  if (width <= areaWidth) {
    imageX = (areaWidth - width) / 2;
  } else {
    const minX = areaWidth - width;
    if (imageX > 0) imageX = 0;
    if (imageX < minX) imageX = minX;
  }
  if (height <= areaHeight) {
    imageY = (areaHeight - height) / 2;
  } else {
    const minY = areaHeight - height;
    if (imageY > 0) imageY = 0;
    if (imageY < minY) imageY = minY;
  }
}
/* =========================================
   ズーム
========================================= */
zoomSlider.addEventListener("input", function () {
  if (!originalImage) return;
  const newZoom =
    Number(this.value);
  const areaWidth =
    cropArea.clientWidth;
  const areaHeight =
    cropArea.clientHeight;
  const centerX =
    areaWidth / 2;
  const centerY =
    areaHeight / 2;
  const oldScale = imageScale;
  const baseScale =
    Math.max(
      areaWidth / originalImage.naturalWidth,
      areaHeight / originalImage.naturalHeight
    );
  imageScale =
    baseScale * newZoom;
  imageX =
    centerX -
    (centerX - imageX) *
    (imageScale / oldScale);
  imageY =
    centerY -
    (centerY - imageY) *
    (imageScale / oldScale);
  keepImageInside();
  updateCropImage();
});
/* =========================================
   ドラッグ
========================================= */
cropArea.addEventListener(
  "pointerdown",
  function (event) {
    dragging = true;
    startX = event.clientX - imageX;
    startY = event.clientY - imageY;
    cropArea.setPointerCapture(event.pointerId);
  }
);
cropArea.addEventListener(
  "pointermove",
  function (event) {
    if (!dragging) return;
    imageX = event.clientX - startX;
    imageY = event.clientY - startY;
    keepImageInside();
    updateCropImage();
  }
);
cropArea.addEventListener(
  "pointerup",
  function () {
    dragging = false;
  }
);
cropArea.addEventListener(
  "pointercancel",
  function () {
    dragging = false;
  }
);
/* =========================================
   正方形画像を作成
========================================= */
function createCroppedCanvas() {
  const areaWidth =
    cropArea.clientWidth;
  const areaHeight =
    cropArea.clientHeight;
  const canvas =
    document.createElement("canvas");
  canvas.width = 800;
  canvas.height = 800;
  const ctx =
    canvas.getContext("2d");
  const sourceX =
    -imageX / imageScale;
  const sourceY =
    -imageY / imageScale;
  const sourceSize =
    areaWidth / imageScale;
  ctx.drawImage(
    originalImage,
    sourceX,
    sourceY,
    sourceSize,
    sourceSize,
    0,
    0,
    800,
    800
  );
  return canvas;
}
/* =========================================
   写真を使用
========================================= */
usePhotoButton.addEventListener(
  "click",
  function () {
    if (!selectedKana || !originalImage) return;
    const canvas =
      createCroppedCanvas();
    const dataURL =
      canvas.toDataURL(
        "image/jpeg",
        0.9
      );
    photos[selectedKana] = dataURL;
    localStorage.setItem(
      "gojuonPhotos",
      JSON.stringify(photos)
    );
    closeModal();
    renderTable();
  }
);
/* =========================================
   写真アプリに保存
========================================= */
savePhotoButton.addEventListener(
  "click",
  async function () {
    if (!originalImage) return;
    const canvas =
      createCroppedCanvas();
    canvas.toBlob(
      async function (blob) {
        if (!blob) return;
        const file =
          new File(
            [blob],
            "gojuon-photo.jpg",
            {
              type: "image/jpeg"
            }
          );
        try {
          if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
              files: [file]
            })
          ) {
            await navigator.share({
              files: [file],
              title: "五十音あつめ"
            });
          } else {
            const url =
              URL.createObjectURL(blob);
            const newWindow =
              window.open(url, "_blank");
            if (!newWindow) {
              alert(
                "画像を開けませんでした。"
              );
            }
          }
        } catch (error) {
          if (error.name !== "AbortError") {
            console.error(error);
          }
        }
      },
      "image/jpeg"
    );
  }
);
/* =========================================
   モーダルを閉じる
========================================= */
cancelCropButton.addEventListener(
  "click",
  closeModal
);
function closeModal() {
  cropModal.classList.remove("show");
  selectedKana = null;
  originalImage = null;
  cropImage.src = "";
}
/* =========================================
   一覧を画像保存
========================================= */
saveBoardButton.addEventListener(
  "click",
  saveBoard
);
async function saveBoard() {
  const canvas =
    document.createElement("canvas");
  const ctx =
    canvas.getContext("2d");
  const width = 1400;
  const padding = 60;
  const cellSize = 220;
  const gap = 20;
  const rows = kanaRows.length;
  const gridHeight =
    rows * cellSize +
    (rows - 1) * gap;
  const height =
    padding +
    100 +
    gridHeight +
    padding;
  canvas.width = width;
  canvas.height = height;
  /* 背景 */
  ctx.fillStyle = "#f7f9fa";
  ctx.fillRect(
    0,
    0,
    width,
    height
  );
  /* タイトル */
  ctx.fillStyle = "#587b8c";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font =
    "600 38px 'Hiragino Maru Gothic ProN', sans-serif";
  ctx.fillText(
    "五十音あつめ",
    width / 2,
    55
  );
  /* グリッド */
  const gridWidth =
    5 * cellSize +
    4 * gap;
  const startX =
    (width - gridWidth) / 2;
  const startY =
    120;
  kanaRows.forEach(
    (row, rowIndex) => {
      row.forEach(
        (kana, colIndex) => {
          if (!kana) return;
          const x =
            startX +
            colIndex *
              (cellSize + gap);
          const y =
            startY +
            rowIndex *
              (cellSize + gap);
          /* 枠 */
          ctx.fillStyle =
            "#ffffff";
          ctx.strokeStyle =
            "#d7e3e7";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(
            x,
            y,
            cellSize,
            cellSize,
            14
          );
          ctx.fill();
          ctx.stroke();
          /* 写真 */
          if (photos[kana]) {
            const img =
              new Image();
            img.src =
              photos[kana];
            img.onload = function () {
              ctx.save();
              ctx.beginPath();
              ctx.roundRect(
                x,
                y,
                cellSize,
                cellSize,
                14
              );
              ctx.clip();
              ctx.drawImage(
                img,
                x,
                y,
                cellSize,
                cellSize
              );
              ctx.restore();
              saveBoardImageIfReady(
                canvas
              );
            };
          } else {
            drawEmptyKana(
              ctx,
              kana,
              x,
              y,
              cellSize
            );
          }
        }
      );
    }
  );
  /*
    写真がない場合は、
    非同期画像読み込みがないため
    そのまま保存
  */
  const hasPhotos =
    Object.keys(photos).length > 0;
  if (!hasPhotos) {
    saveBoardCanvas(canvas);
  } else {
    /*
      少し待ってから保存。
      写真枚数が多い場合にも対応。
    */
    setTimeout(
      () => saveBoardCanvas(canvas),
      500
    );
  }
}
/* =========================================
   一覧画像：空の文字
========================================= */
function drawEmptyKana(
  ctx,
  kana,
  x,
  y,
  size
) {
  ctx.fillStyle =
    "#7895a2";
  ctx.font =
    "500 54px 'Hiragino Maru Gothic ProN', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(
    kana,
    x + size / 2,
    y + size / 2
  );
}
/* =========================================
   一覧画像を保存
========================================= */
let boardSaveDone = false;
function saveBoardImageIfReady(canvas) {
  /*
    canvasの描画後に保存処理を
    呼び出すための補助関数
  */
}
/* =========================================
   canvas保存
========================================= */
async function saveBoardCanvas(canvas) {
  canvas.toBlob(
    async function (blob) {
      if (!blob) return;
      const file =
        new File(
          [blob],
          "五十音あつめ.jpg",
          {
            type: "image/jpeg"
          }
        );
      try {
        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {
          await navigator.share({
            files: [file],
            title: "五十音あつめ"
          });
        } else {
          const url =
            URL.createObjectURL(blob);
          const a =
            document.createElement("a");
          a.href = url;
          a.download =
            "五十音あつめ.jpg";
          a.click();
          URL.revokeObjectURL(url);
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          console.error(error);
        }
      }
    },
    "image/jpeg",
    0.92
  );
}
/* =========================================
   一覧表示
========================================= */
function renderTable() {
  kanaGrid.innerHTML = "";
  kanaRows.forEach(
    row => {
      const rowElement =
        document.createElement("div");
      rowElement.className =
        "kana-row";
      row.forEach(
        kana => {
          if (!kana) {
            const blank =
              document.createElement("div");
            rowElement.appendChild(blank);
            return;
          }
          const item =
            document.createElement("div");
          item.className =
            "kana-item";
          /* =================================
             写真あり
          ================================= */
          if (photos[kana]) {
            item.classList.add(
              "has-photo"
            );
            const img =
              document.createElement("img");
            img.src =
              photos[kana];
            img.alt = "";
            item.appendChild(img);
            /*
              写真がある場合は
              文字・ラベルを作らない
            */
            const deleteButton =
              document.createElement("button");
            deleteButton.className =
              "delete-btn";
            deleteButton.textContent =
              "×";
            deleteButton.addEventListener(
              "click",
              function (event) {
                event.stopPropagation();
                delete photos[kana];
                savePhotos();
                renderTable();
              }
            );
            item.appendChild(
              deleteButton
            );
          }
          /* =================================
             写真なし
          ================================= */
          else {
            item.classList.add(
              "empty"
            );
            const empty =
              document.createElement("div");
            empty.className =
              "kana-empty";
            empty.textContent =
              "＋";
            item.appendChild(empty);
            const label =
              document.createElement("div");
            label.className =
              "kana-label";
            label.textContent =
              kana;
            item.appendChild(label);
          }
          item.addEventListener(
            "click",
            function () {
              selectKana(kana);
            }
          );
          rowElement.appendChild(item);
        }
      );
      kanaGrid.appendChild(
        rowElement
      );
    }
  );
  updateProgress();
}
/* =========================================
   進捗更新
========================================= */
function updateProgress() {
  const count =
    allKana.filter(
      kana => photos[kana]
    ).length;
  progressNumber.textContent =
    `${count} / 46`;
}
/* =========================================
   保存
========================================= */
function savePhotos() {
  localStorage.setItem(
    "gojuonPhotos",
    JSON.stringify(photos)
  );
}
/* =========================================
   すべて削除
========================================= */
clearAllButton.addEventListener(
  "click",
  function () {
    const confirmed =
      confirm(
        "集めた写真をすべて削除しますか？"
      );
    if (!confirmed) return;
    photos = {};
    localStorage.removeItem(
      "gojuonPhotos"
    );
    renderTable();
  }
);
/* =========================================
   初期表示
========================================= */
renderTable();
</script>
</body>
</html>
