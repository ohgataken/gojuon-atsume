<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五十音あつめ</title>
<style>
* {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
}
body {
  margin: 0;
  font-family:
    "Hiragino Maru Gothic ProN",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
  background:
    linear-gradient(
      180deg,
      #edf7fa 0%,
      #f7fbfc 45%,
      #eef5f7 100%
    );
  color: #506873;
  letter-spacing: 0.025em;
}
/* =========================================
   ヘッダー
========================================= */
header {
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(
      135deg,
      #8daab6 0%,
      #7898a5 55%,
      #6f8e9b 100%
    );
  color: #ffffff;
  text-align: center;
  padding: 25px 16px 22px;
  box-shadow:
    0 4px 18px rgba(86, 116, 128, 0.18);
}
header::before {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background:
    rgba(220, 244, 250, 0.15);
  top: -80px;
  left: -45px;
}
header::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background:
    rgba(255, 255, 255, 0.08);
  right: -70px;
  bottom: -100px;
}
header h1 {
  position: relative;
  z-index: 1;
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-shadow:
    0 2px 5px rgba(70, 95, 105, 0.15);
}
header p {
  position: relative;
  z-index: 1;
  margin: 7px 0 0;
  font-size: 11px;
  letter-spacing: 0.06em;
  color:
    rgba(255,255,255,0.92);
}
/* =========================================
   全体
========================================= */
.container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 18px 14px 42px;
}
/* =========================================
   進捗
========================================= */
.progress-box {
  background:
    rgba(255, 255, 255, 0.92);
  border:
    1px solid #d8e8ed;
  border-radius: 18px;
  padding: 13px 16px;
  margin-bottom: 17px;
  text-align: center;
  box-shadow:
    0 5px 18px rgba(86, 116, 128, 0.08);
}
.progress-text {
  font-size: 13px;
  font-weight: 600;
  color: #667f89;
  letter-spacing: 0.06em;
}
.progress-number {
  color: #769baa;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0;
}
/* =========================================
   五十音グリッド
========================================= */
.kana-grid {
  display: grid;
  gap: 9px;
}
.kana-row {
  display: grid;
  grid-template-columns:
    repeat(5, 1fr);
  gap: 9px;
}
/* =========================================
   カード
========================================= */
.kana-card {
  position: relative;
  aspect-ratio: 1 / 1;
  background:
    rgba(255, 255, 255, 0.96);
  border:
    1px solid #d4e5ea;
  border-radius: 15px;
  overflow: hidden;
  cursor: pointer;
  box-shadow:
    0 4px 12px rgba(82, 112, 123, 0.08);
  transition:
    transform 0.16s ease,
    box-shadow 0.16s ease;
}
.kana-card:hover {
  box-shadow:
    0 7px 17px rgba(82, 112, 123, 0.13);
}
.kana-card:active {
  transform: scale(0.965);
}
/* =========================================
   空カード
========================================= */
.kana-empty {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  color: #89a4ae;
}
.kana-empty .kana {
  font-size: 25px;
  font-weight: 600;
  letter-spacing: 0.03em;
}
.plus {
  font-size: 19px;
  line-height: 1;
  margin-top: 6px;
  color: #b0ccd5;
  font-weight: 300;
}
/* =========================================
   写真
========================================= */
.kana-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
/* =========================================
   かなラベル
========================================= */
.kana-label {
  position: absolute;
  left: 6px;
  bottom: 6px;
  min-width: 28px;
  height: 27px;
  padding: 0 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    rgba(255, 255, 255, 0.91);
  color: #59727d;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 700;
  box-shadow:
    0 2px 7px rgba(65, 91, 101, 0.14);
  backdrop-filter: blur(4px);
}
/* =========================================
   削除ボタン
========================================= */
.delete-btn {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 25px;
  height: 25px;
  border: none;
  border-radius: 50%;
  background:
    rgba(79, 101, 111, 0.68);
  color: #ffffff;
  font-size: 15px;
  line-height: 25px;
  padding: 0;
  cursor: pointer;
  z-index: 5;
  -webkit-tap-highlight-color: transparent;
}
/* =========================================
   ボタンエリア
========================================= */
.button-area {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 21px;
}
button {
  font-family: inherit;
}
/* =========================================
   メインボタン
========================================= */
.main-button {
  width: 100%;
  border: none;
  border-radius: 15px;
  padding: 13px 16px;
  background:
    linear-gradient(
      135deg,
      #8eb6c3,
      #789eab
    );
  color: #ffffff;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.05em;
  box-shadow:
    0 5px 13px rgba(86, 119, 131, 0.18);
  cursor: pointer;
}
.main-button:active {
  transform: scale(0.98);
}
/* =========================================
   サブボタン
========================================= */
.sub-button {
  width: 100%;
  border:
    1px solid #c7dce3;
  border-radius: 15px;
  padding: 11px 16px;
  background:
    rgba(255, 255, 255, 0.78);
  color: #718994;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
/* =========================================
   ファイル入力
========================================= */
#fileInput {
  display: none;
}
/* =========================================
   モーダル
========================================= */
.modal {
  position: fixed;
  inset: 0;
  background:
    rgba(57, 78, 87, 0.60);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 100;
  backdrop-filter: blur(5px);
}
.modal.show {
  display: flex;
}
.modal-content {
  width: min(92vw, 500px);
  max-height: 92vh;
  overflow-y: auto;
  background:
    #f9fcfd;
  border:
    1px solid #d9e8ec;
  border-radius: 21px;
  padding: 17px;
  box-shadow:
    0 15px 45px rgba(45, 67, 77, 0.28);
}
.modal-title {
  text-align: center;
  color: #5c7580;
  font-size: 16px;
  font-weight: 700;
  margin: 2px 0 13px;
  letter-spacing: 0.06em;
}
/* =========================================
   クロップエリア
========================================= */
.crop-area {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background:
    #dcecf1;
  border-radius: 16px;
  overflow: hidden;
  touch-action: none;
  box-shadow:
    inset 0 0 0 1px #c7dce2,
    0 4px 12px rgba(70, 95, 105, 0.08);
}
#cropImage {
  position: absolute;
  max-width: none;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  display: none;
}
/* =========================================
   ズーム
========================================= */
.zoom-area {
  margin: 15px 0 12px;
}
.zoom-label {
  text-align: center;
  font-size: 12px;
  color: #78909a;
  margin-bottom: 7px;
}
#zoomSlider {
  width: 100%;
  accent-color: #7fa8b5;
}
/* =========================================
   モーダルボタン
========================================= */
.modal-buttons {
  display: grid;
  gap: 8px;
}
.modal-buttons button {
  border: none;
  border-radius: 14px;
  padding: 12px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer;
}
.cancel-button {
  background:
    #e8f0f3;
  color:
    #71858d;
}
.save-photo-button {
  background:
    #a4c5ce;
  color:
    #ffffff;
}
.use-button {
  background:
    linear-gradient(
      135deg,
      #87afbc,
      #739aa8
    );
  color:
    #ffffff;
  box-shadow:
    0 4px 10px rgba(88, 120, 132, 0.14);
}
/* =========================================
   スマホ
========================================= */
@media (max-width: 430px) {
  header {
    padding-top: 23px;
    padding-bottom: 21px;
  }
  header h1 {
    font-size: 23px;
  }
  header p {
    font-size: 10px;
  }
  .container {
    padding-top: 16px;
    padding-left: 11px;
    padding-right: 11px;
  }
  .kana-grid {
    gap: 8px;
  }
  .kana-row {
    gap: 8px;
  }
  .kana-card {
    border-radius: 14px;
  }
  .kana-empty .kana {
    font-size: 23px;
  }
  .plus {
    font-size: 18px;
  }
  .progress-box {
    border-radius: 17px;
  }
}
/* =========================================
   PC
========================================= */
@media (min-width: 700px) {
  .container {
    padding-left: 20px;
    padding-right: 20px;
  }
  .kana-grid {
    gap: 12px;
  }
  .kana-row {
    gap: 12px;
  }
}
</style>
</head>
<body>
<header>
  <h1>五十音あつめ</h1>
  <p>写真を集めて、五十音を完成させよう</p>
</header>
<div class="container">
  <div class="progress-box">
    <div class="progress-text">
      <span
        id="progressNumber"
        class="progress-number"
      >0</span>
      / 46 文字 集めました
    </div>
  </div>
  <div
    id="kanaGrid"
    class="kana-grid"
  ></div>
  <div class="button-area">
    <button
      class="main-button"
      onclick="saveBoard()"
    >
      一覧を画像保存
    </button>
    <button
      class="sub-button"
      onclick="clearAll()"
    >
      すべて削除
    </button>
  </div>
</div>
<input
  type="file"
  id="fileInput"
  accept="image/*"
>
<!-- =====================================
     写真編集モーダル
===================================== -->
<div
  id="cropModal"
  class="modal"
>
  <div class="modal-content">
    <div class="modal-title">
      写真を調整
    </div>
    <div
      id="cropArea"
      class="crop-area"
    >
      <img
        id="cropImage"
        alt=""
      >
    </div>
    <div class="zoom-area">
      <div class="zoom-label">
        拡大・縮小
      </div>
      <input
        type="range"
        id="zoomSlider"
        min="1"
        max="3"
        step="0.01"
        value="1"
      >
    </div>
    <div class="modal-buttons">
      <button
        class="cancel-button"
        onclick="closeModal()"
      >
        キャンセル
      </button>
      <button
        class="save-photo-button"
        onclick="saveCurrentPhotoToPhotos()"
      >
        写真アプリに保存
      </button>
      <button
        class="use-button"
        onclick="usePhoto()"
      >
        この写真を使う
      </button>
    </div>
  </div>
</div>
<script>
const kanaRows = [
  ["あ","い","う","え","お"],
  ["か","き","く","け","こ"],
  ["さ","し","す","せ","そ"],
  ["た","ち","つ","て","と"],
  ["な","に","ぬ","ね","の"],
  ["は","ひ","ふ","へ","ほ"],
  ["ま","み","む","め","も"],
  ["や","","ゆ","","よ"],
  ["ら","り","る","れ","ろ"],
  ["わ","を","ん","",""]
];
const allKana = [
  "あ","い","う","え","お",
  "か","き","く","け","こ",
  "さ","し","す","せ","そ",
  "た","ち","つ","て","と",
  "な","に","ぬ","ね","の",
  "は","ひ","ふ","へ","ほ",
  "ま","み","む","め","も",
  "や","ゆ","よ",
  "ら","り","る","れ","ろ",
  "わ","を","ん"
];
let photos =
  JSON.parse(
    localStorage.getItem(
      "gojuonPhotos"
    ) || "{}"
  );
let currentKana = null;
let originalImage = null;
let imageX = 0;
let imageY = 0;
let baseScale = 1;
let baseImageWidth = 0;
let baseImageHeight = 0;
let dragging = false;
let dragStartX = 0;
let dragStartY = 0;
const fileInput =
  document.getElementById(
    "fileInput"
  );
const cropModal =
  document.getElementById(
    "cropModal"
  );
const cropArea =
  document.getElementById(
    "cropArea"
  );
const cropImage =
  document.getElementById(
    "cropImage"
  );
const zoomSlider =
  document.getElementById(
    "zoomSlider"
  );
/* =========================================
   写真選択
========================================= */
fileInput.addEventListener(
  "change",
  function () {
    const file =
      this.files[0];
    if (
      !file ||
      !currentKana
    ) {
      return;
    }
    const reader =
      new FileReader();
    reader.onload =
      function (e) {
        const dataURL =
          e.target.result;
        originalImage =
          new Image();
        originalImage.onload =
          function () {
            cropImage.src =
              dataURL;
            cropImage.style.display =
              "block";
            cropImage.style.visibility =
              "visible";
            cropImage.style.opacity =
              "1";
            zoomSlider.value = 1;
            zoomSlider.dataset.oldZoom = 1;
            cropModal.classList.add(
              "show"
            );
            requestAnimationFrame(
              () => {
                setupCrop();
              }
            );
          };
        originalImage.src =
          dataURL;
      };
    reader.readAsDataURL(
      file
    );
    fileInput.value = "";
  }
);
/* =========================================
   クロップ初期設定
========================================= */
function setupCrop() {
  if (!originalImage) {
    return;
  }
  const areaWidth =
    cropArea.clientWidth;
  const areaHeight =
    cropArea.clientHeight;
  const imageWidth =
    originalImage.naturalWidth;
  const imageHeight =
    originalImage.naturalHeight;
  baseScale =
    Math.max(
      areaWidth / imageWidth,
      areaHeight / imageHeight
    );
  baseImageWidth =
    imageWidth * baseScale;
  baseImageHeight =
    imageHeight * baseScale;
  imageX =
    (areaWidth -
      baseImageWidth) / 2;
  imageY =
    (areaHeight -
      baseImageHeight) / 2;
  zoomSlider.value = 1;
  zoomSlider.dataset.oldZoom = 1;
  updateCropImage();
}
/* =========================================
   画像位置更新
========================================= */
function updateCropImage() {
  const zoom =
    Number(
      zoomSlider.value
    );
  const width =
    baseImageWidth * zoom;
  const height =
    baseImageHeight * zoom;
  cropImage.style.width =
    width + "px";
  cropImage.style.height =
    height + "px";
  cropImage.style.left =
    imageX + "px";
  cropImage.style.top =
    imageY + "px";
  keepImageInside();
}
/* =========================================
   画像が枠から出ないようにする
========================================= */
function keepImageInside() {
  const areaWidth =
    cropArea.clientWidth;
  const areaHeight =
    cropArea.clientHeight;
  const zoom =
    Number(
      zoomSlider.value
    );
  const width =
    baseImageWidth * zoom;
  const height =
    baseImageHeight * zoom;
  if (
    width >= areaWidth
  ) {
    imageX =
      Math.min(
        0,
        Math.max(
          areaWidth - width,
          imageX
        )
      );
  } else {
    imageX =
      (areaWidth - width) / 2;
  }
  if (
    height >= areaHeight
  ) {
    imageY =
      Math.min(
        0,
        Math.max(
          areaHeight - height,
          imageY
        )
      );
  } else {
    imageY =
      (areaHeight - height) / 2;
  }
  cropImage.style.left =
    imageX + "px";
  cropImage.style.top =
    imageY + "px";
}
/* =========================================
   ズーム
========================================= */
zoomSlider.addEventListener(
  "input",
  function () {
    const oldZoom =
      Number(
        zoomSlider.dataset.oldZoom || 1
      );
    const newZoom =
      Number(
        zoomSlider.value
      );
    const areaWidth =
      cropArea.clientWidth;
    const areaHeight =
      cropArea.clientHeight;
    const centerX =
      areaWidth / 2;
    const centerY =
      areaHeight / 2;
    const oldWidth =
      baseImageWidth * oldZoom;
    const oldHeight =
      baseImageHeight * oldZoom;
    const imagePointX =
      (centerX - imageX) /
      oldWidth;
    const imagePointY =
      (centerY - imageY) /
      oldHeight;
    const newWidth =
      baseImageWidth * newZoom;
    const newHeight =
      baseImageHeight * newZoom;
    imageX =
      centerX -
      imagePointX * newWidth;
    imageY =
      centerY -
      imagePointY * newHeight;
    zoomSlider.dataset.oldZoom =
      newZoom;
    updateCropImage();
  }
);
/* =========================================
   ドラッグ
========================================= */
cropArea.addEventListener(
  "pointerdown",
  function (e) {
    dragging = true;
    cropArea.setPointerCapture(
      e.pointerId
    );
    dragStartX =
      e.clientX - imageX;
    dragStartY =
      e.clientY - imageY;
  }
);
cropArea.addEventListener(
  "pointermove",
  function (e) {
    if (!dragging) {
      return;
    }
    imageX =
      e.clientX - dragStartX;
    imageY =
      e.clientY - dragStartY;
    updateCropImage();
  }
);
cropArea.addEventListener(
  "pointerup",
  function () {
    dragging = false;
  }
);
cropArea.addEventListener(
  "pointercancel",
  function () {
    dragging = false;
  }
);
/* =========================================
   クロップ画像作成
========================================= */
function createCroppedCanvas() {
  const canvas =
    document.createElement(
      "canvas"
    );
  canvas.width = 800;
  canvas.height = 800;
  const ctx =
    canvas.getContext("2d");
  ctx.fillStyle =
    "#ffffff";
  ctx.fillRect(
    0,
    0,
    800,
    800
  );
  const areaWidth =
    cropArea.clientWidth;
  const ratio =
    800 / areaWidth;
  const zoom =
    Number(
      zoomSlider.value
    );
  const drawWidth =
    baseImageWidth *
    zoom *
    ratio;
  const drawHeight =
    baseImageHeight *
    zoom *
    ratio;
  const drawX =
    imageX * ratio;
  const drawY =
    imageY * ratio;
  ctx.drawImage(
    originalImage,
    drawX,
    drawY,
    drawWidth,
    drawHeight
  );
  return canvas;
}
/* =========================================
   写真を使う
========================================= */
function usePhoto() {
  if (
    !currentKana ||
    !originalImage
  ) {
    return;
  }
  const canvas =
    createCroppedCanvas();
  photos[currentKana] =
    canvas.toDataURL(
      "image/jpeg",
      0.88
    );
  savePhotos();
  closeModal();
  renderTable();
}
/* =========================================
   写真アプリに保存
========================================= */
async function saveCurrentPhotoToPhotos() {
  if (!originalImage) {
    return;
  }
  const canvas =
    createCroppedCanvas();
  canvas.toBlob(
    async function (blob) {
      if (!blob) {
        return;
      }
      const file =
        new File(
          [blob],
          "五十音あつめ.png",
          {
            type: "image/png"
          }
        );
      try {
        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {
          await navigator.share({
            files: [file],
            title: "五十音あつめ"
          });
        } else {
          const url =
            URL.createObjectURL(
              blob
            );
          window.open(
            url,
            "_blank"
          );
          alert(
            "画像を長押しして「写真に保存」を選んでください。"
          );
        }
      } catch (error) {
        console.log(error);
      }
    },
    "image/png"
  );
}
/* =========================================
   モーダルを閉じる
========================================= */
function closeModal() {
  cropModal.classList.remove(
    "show"
  );
  currentKana = null;
  originalImage = null;
  cropImage.src = "";
  cropImage.style.display =
    "none";
}
/* =========================================
   保存
========================================= */
function savePhotos() {
  try {
    localStorage.setItem(
      "gojuonPhotos",
      JSON.stringify(photos)
    );
  } catch (error) {
    alert(
      "写真の保存容量がいっぱいになりました。\n一部の写真を削除してください。"
    );
  }
}
/* =========================================
   五十音表
========================================= */
function renderTable() {
  const grid =
    document.getElementById(
      "kanaGrid"
    );
  grid.innerHTML = "";
  kanaRows.forEach(
    row => {
      const rowElement =
        document.createElement(
          "div"
        );
      rowElement.className =
        "kana-row";
      row.forEach(
        kana => {
          const card =
            document.createElement(
              "div"
            );
          card.className =
            "kana-card";
          if (!kana) {
            card.style.visibility =
              "hidden";
            rowElement.appendChild(
              card
            );
            return;
          }
          if (photos[kana]) {
            const img =
              document.createElement(
                "img"
              );
            img.src =
              photos[kana];
            card.appendChild(
              img
            );
            const label =
              document.createElement(
                "div"
              );
            label.className =
              "kana-label";
            label.textContent =
              kana;
            card.appendChild(
              label
            );
            const deleteBtn =
              document.createElement(
                "button"
              );
            deleteBtn.className =
              "delete-btn";
            deleteBtn.textContent =
              "×";
            deleteBtn.onclick =
              function (e) {
                e.stopPropagation();
                if (
                  confirm(
                    `「${kana}」の写真を削除しますか？`
                  )
                ) {
                  delete photos[kana];
                  savePhotos();
                  renderTable();
                }
              };
            card.appendChild(
              deleteBtn
            );
          } else {
            const empty =
              document.createElement(
                "div"
              );
            empty.className =
              "kana-empty";
            const kanaText =
              document.createElement(
                "div"
              );
            kanaText.className =
              "kana";
            kanaText.textContent =
              kana;
            const plus =
              document.createElement(
                "div"
              );
            plus.className =
              "plus";
            plus.textContent =
              "+";
            empty.appendChild(
              kanaText
            );
            empty.appendChild(
              plus
            );
            card.appendChild(
              empty
            );
          }
          card.onclick =
            function () {
              currentKana =
                kana;
              fileInput.click();
            };
          rowElement.appendChild(
            card
          );
        }
      );
      grid.appendChild(
        rowElement
      );
    }
  );
  updateProgress();
}
/* =========================================
   進捗
========================================= */
function updateProgress() {
  const count =
    allKana.filter(
      kana => photos[kana]
    ).length;
  document.getElementById(
    "progressNumber"
  ).textContent =
    count;
}
/* =========================================
   一覧画像保存
========================================= */
async function saveBoard() {
  const canvas =
    document.createElement(
      "canvas"
    );
  const canvasWidth = 1200;
  const cardWidth = 210;
  const cardHeight = 210;
  const gap = 20;
  const rows =
    kanaRows.length;
  canvas.width =
    canvasWidth;
  canvas.height =
    150 +
    rows *
      (cardHeight + gap) +
    60;
  const ctx =
    canvas.getContext("2d");
  ctx.fillStyle =
    "#edf7fa";
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );
  ctx.fillStyle =
    "#526d79";
  ctx.textAlign =
    "center";
  ctx.font =
    "bold 38px 'Hiragino Maru Gothic ProN', sans-serif";
  ctx.fillText(
    "五十音あつめ",
    canvas.width / 2,
    70
  );
  const startX = 55;
  const startY = 120;
  for (
    let r = 0;
    r < kanaRows.length;
    r++
  ) {
    for (
      let c = 0;
      c < 5;
      c++
    ) {
      const kana =
        kanaRows[r][c];
      if (!kana) {
        continue;
      }
      const x =
        startX +
        c *
          (cardWidth + gap);
      const y =
        startY +
        r *
          (cardHeight + gap);
      if (photos[kana]) {
        const img =
          new Image();
        img.src =
          photos[kana];
        await new Promise(
          resolve => {
            img.onload =
              resolve;
            img.onerror =
              resolve;
          }
        );
        ctx.drawImage(
          img,
          x,
          y,
          cardWidth,
          cardHeight
        );
      } else {
        drawEmptyKana(
          ctx,
          kana,
          x,
          y,
          cardWidth,
          cardHeight
        );
      }
      drawKanaLabel(
        ctx,
        kana,
        x,
        y,
        cardWidth,
        cardHeight
      );
    }
  }
  canvas.toBlob(
    async function (blob) {
      if (!blob) {
        return;
      }
      const file =
        new File(
          [blob],
          "五十音あつめ.png",
          {
            type: "image/png"
          }
        );
      try {
        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {
          await navigator.share({
            files: [file],
            title: "五十音あつめ"
          });
        } else {
          const url =
            URL.createObjectURL(
              blob
            );
          window.open(
            url,
            "_blank"
          );
          alert(
            "画像を長押しして「写真に保存」を選んでください。"
          );
        }
      } catch (error) {
        console.log(error);
      }
    },
    "image/png"
  );
}
/* =========================================
   空のマス
========================================= */
function drawEmptyKana(
  ctx,
  kana,
  x,
  y,
  width,
  height
) {
  ctx.fillStyle =
    "#ffffff";
  ctx.fillRect(
    x,
    y,
    width,
    height
  );
  ctx.fillStyle =
    "#8ca8b2";
  ctx.textAlign =
    "center";
  ctx.textBaseline =
    "middle";
  ctx.font =
    "bold 54px 'Hiragino Maru Gothic ProN', sans-serif";
  ctx.fillText(
    kana,
    x + width / 2,
    y + height / 2 - 13
  );
  ctx.font =
    "38px sans-serif";
  ctx.fillStyle =
    "#b1ccd5";
  ctx.fillText(
    "+",
    x + width / 2,
    y + height / 2 + 50
  );
}
/* =========================================
   文字ラベル
========================================= */
function drawKanaLabel(
  ctx,
  kana,
  x,
  y,
  width,
  height
) {
  ctx.fillStyle =
    "rgba(255,255,255,0.91)";
  ctx.fillRect(
    x + 10,
    y + height - 46,
    38,
    35
  );
  ctx.fillStyle =
    "#526d79";
  ctx.textAlign =
    "center";
  ctx.textBaseline =
    "middle";
  ctx.font =
    "bold 20px 'Hiragino Maru Gothic ProN', sans-serif";
  ctx.fillText(
    kana,
    x + 29,
    y + height - 28
  );
}
/* =========================================
   すべて削除
========================================= */
function clearAll() {
  if (
    !confirm(
      "集めた写真をすべて削除しますか？"
    )
  ) {
    return;
  }
  photos = {};
  savePhotos();
  renderTable();
}
/* =========================================
   初期表示
========================================= */
renderTable();
</script>
